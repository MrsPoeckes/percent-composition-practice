<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Percent Composition Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f7f8;
  --surface: #ffffff;
  --ink: #12313a;
  --muted: #536b72;
  --line: #d3e0e3;
  --accent: #0f766e;
  --accent-ink: #ffffff;
  --ok: #17692f;
  --ok-bg: #e4f5e9;
  --bad: #a52a1d;
  --bad-bg: #fdeceb;
  --hint-bg: #fff6df;
  --hint-ink: #6b4a00;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1c20; --surface: #15282d; --ink: #e6f1f3; --muted: #9bb3b9; --line: #29414a;
    --accent: #4fd1c5; --accent-ink: #062a27; --ok: #7fe0a0; --ok-bg: #123422;
    --bad: #ff9d92; --bad-bg: #3a1a17; --hint-bg: #3a2f10; --hint-ink: #f6d98a;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1c20; --surface: #15282d; --ink: #e6f1f3; --muted: #9bb3b9; --line: #29414a;
  --accent: #4fd1c5; --accent-ink: #062a27; --ok: #7fe0a0; --ok-bg: #123422;
  --bad: #ff9d92; --bad-bg: #3a1a17; --hint-bg: #3a2f10; --hint-ink: #f6d98a;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  font-size: 17px; line-height: 1.5;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 1.6rem; margin: 0 0 4px; line-height: 1.2; }
.sub { color: var(--muted); margin: 0 0 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
button { font: inherit; cursor: pointer; }
.ghost {
  background: transparent; color: var(--ink); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 12px;
}
.ghost:hover { border-color: var(--accent); }
.primary {
  background: var(--accent); color: var(--accent-ink); border: 0;
  border-radius: 8px; padding: 11px 20px; font-weight: 700;
}
.primary:hover { filter: brightness(1.08); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.progress { color: var(--muted); margin-left: auto; }

details.masses {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 16px;
}
details.masses summary { cursor: pointer; font-weight: 700; }
.mass-grid { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; color: var(--muted); }
.mass-grid b { color: var(--ink); }

.nav { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
.nav button {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 6px 12px; min-width: 56px;
}
.nav button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 700; }
.nav button.done { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 20px; }
.formula { font-size: 2.4rem; font-weight: 700; line-height: 1.1; margin: 0 0 4px; }
.formula sub { font-size: 0.55em; }
.task { color: var(--muted); margin: 0 0 18px; }

.field { margin-bottom: 14px; }
.field label { display: block; font-weight: 700; margin-bottom: 4px; }
.field label sub { font-size: 0.75em; }
.row { display: flex; gap: 10px; align-items: center; }
.row input {
  font: inherit; width: 150px; padding: 9px 12px; border-radius: 8px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink);
}
.row input:focus-visible { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.unit { color: var(--muted); }
.field.ok input { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); font-weight: 700; }
.field.bad input { border-color: var(--bad); background: var(--bad-bg); }
.msg { margin: 6px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; }
.msg.ok { background: var(--ok-bg); color: var(--ok); }
.msg.bad { background: var(--hint-bg); color: var(--hint-ink); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.banner { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--ok-bg); color: var(--ok); font-weight: 700; }

.solution { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.solution h2 { font-size: 1.05rem; margin: 0 0 8px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 440px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 700; }
td.num { font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 0.95rem; margin-top: 8px; }

.results { margin-top: 20px; }
.results textarea {
  width: 100%; min-height: 200px; font: 0.95rem/1.5 ui-monospace, Consolas, monospace;
  padding: 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
.name-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.name-row input { font: inherit; padding: 8px 12px; border-radius: 8px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); min-width: 220px; }
@media (max-width: 480px) {
  .formula { font-size: 2rem; }
  .row input { width: 130px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Percent composition practice</h1>
  <p class="sub">Find the molar mass and the percent by mass of each element. Round to 2 decimal places. Type numbers only.</p>

  <div class="bar">
    <button class="ghost" id="resultsBtn" type="button">See my results</button>
    <span class="progress" id="progress" aria-live="polite"></span>
  </div>

  <details class="masses">
    <summary>Atomic masses (g/mol)</summary>
    <div class="mass-grid" id="massGrid"></div>
  </details>

  <nav class="nav" id="nav" aria-label="Compounds"></nav>

  <section class="card" id="card" aria-live="polite"></section>

  <section class="results" id="results" hidden></section>
</div>

<script>
(function () {
  var ATOMIC = { H: 1.01, C: 12.01, N: 14.01, O: 16.00, Na: 22.99, Mg: 24.31, Al: 26.98, P: 30.97, S: 32.07, Cl: 35.45, Ca: 40.08 };

  // each element: symbol, number of atoms, total mass in the formula, correct percent
  var COMPOUNDS = [
    { f: "H<sub>2</sub>O", plain: "H2O", M: 18.02, els: [["H",2,2.02,11.21],["O",1,16.00,88.79]] },
    { f: "CO<sub>2</sub>", plain: "CO2", M: 44.01, els: [["C",1,12.01,27.29],["O",2,32.00,72.71]] },
    { f: "NaCl", plain: "NaCl", M: 58.44, els: [["Na",1,22.99,39.34],["Cl",1,35.45,60.66]] },
    { f: "CaCl<sub>2</sub>", plain: "CaCl2", M: 110.99, els: [["Ca",1,40.08,36.11],["Cl",2,70.91,63.89]] },
    { f: "Al<sub>2</sub>O<sub>3</sub>", plain: "Al2O3", M: 101.96, els: [["Al",2,53.96,52.92],["O",3,48.00,47.08]] },
    { f: "NH<sub>4</sub>NO<sub>3</sub>", plain: "NH4NO3", M: 80.04, els: [["N",2,28.01,34.99],["H",4,4.03,5.03],["O",3,48.00,59.97]] },
    { f: "Mg(OH)<sub>2</sub>", plain: "Mg(OH)2", M: 58.33, paren: true, els: [["Mg",1,24.31,41.68],["O",2,32.00,54.86],["H",2,2.02,3.46]] },
    { f: "Ca(OH)<sub>2</sub>", plain: "Ca(OH)2", M: 74.10, paren: true, els: [["Ca",1,40.08,54.09],["O",2,32.00,43.18],["H",2,2.02,2.73]] },
    { f: "Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub>", plain: "Al2(SO4)3", M: 342.16, paren: true, els: [["Al",2,53.96,15.77],["S",3,96.20,28.12],["O",12,192.00,56.11]] },
    { f: "(NH<sub>4</sub>)<sub>3</sub>PO<sub>4</sub>", plain: "(NH4)3PO4", M: 149.09, paren: true, els: [["N",3,42.02,28.18],["H",12,12.10,8.12],["P",1,30.97,20.77],["O",4,64.00,42.93]] }
  ];
  var TOL = 0.1;

  // state per compound
  var state = COMPOUNDS.map(function (c) {
    return { checks: 0, solved: {}, firstTry: {}, shown: false, done: false, vals: {}, msgs: {} };
  });
  var cur = 0;

  var $ = function (id) { return document.getElementById(id); };
  var card = $("card"), nav = $("nav"), results = $("results");

  // atomic mass reference
  $("massGrid").innerHTML = Object.keys(ATOMIC).map(function (k) {
    return "<span><b>" + k + "</b> " + ATOMIC[k].toFixed(2) + "</span>";
  }).join("");

  function parse(s) {
    if (s == null) return NaN;
    s = String(s).replace(/,/g, ".").replace(/[^0-9.\-]/g, "");
    if (s === "" || s === "." || s === "-") return NaN;
    return parseFloat(s);
  }
  function near(a, b) { return Math.abs(a - b) <= TOL + 1e-9; }

  function fieldDefs(c) {
    var defs = [{ key: "M", label: "Molar mass of " + c.f, unit: "g/mol", answer: c.M }];
    c.els.forEach(function (e) {
      defs.push({ key: e[0], label: "% " + e[0] + " in " + c.f, unit: "%", answer: e[3], el: e });
    });
    return defs;
  }

  function hintFor(c, def, v, s) {
    if (isNaN(v)) return "Enter a number in this box.";
    if (def.key === "M") {
      var perAtom = c.els.reduce(function (t, e) { return t + e[2] / e[1]; }, 0);
      if (near(v, perAtom)) return "It looks like each element was counted once. Multiply each atomic mass by how many atoms of it are in the formula.";
      if (Math.abs(v - def.answer) / def.answer < 0.03) return "Close. Re-check your atomic masses and the number of atoms of each element.";
      return "Add up (atomic mass × number of atoms) for every element." + (c.paren ? " The subscript outside the parentheses multiplies everything inside." : "");
    }
    if (v > 100) return "A single element can't be more than 100% of the compound.";
    if (v <= 1 && near(v * 100, def.answer)) return "That looks like a decimal. Multiply by 100 to get a percent.";
    var other = c.els.filter(function (e) { return e[0] !== def.key && near(v, e[3]); })[0];
    if (other) return "That value is the percent for " + other[0] + ". This box asks about " + def.key + ".";
    var tail = " Divide the total mass of " + def.key + " in the formula by the molar mass, then multiply by 100.";
    if (!s.solved.M) tail += " Make sure your molar mass is right first.";
    return "Not quite." + tail;
  }

  function renderNav() {
    nav.innerHTML = "";
    COMPOUNDS.forEach(function (c, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = c.f;
      if (state[i].done) b.className = "done";
      if (i === cur) b.setAttribute("aria-current", "true");
      b.setAttribute("aria-label", "Compound " + (i + 1) + ": " + c.plain + (state[i].done ? " (finished)" : ""));
      b.onclick = function () { cur = i; render(); };
      nav.appendChild(b);
    });
    var d = state.filter(function (s) { return s.done; }).length;
    $("progress").textContent = d + " of " + COMPOUNDS.length + " finished";
  }

  function render() {
    renderNav();
    var c = COMPOUNDS[cur], s = state[cur];
    var defs = fieldDefs(c);
    var html = '<p class="formula">' + c.f + '</p><p class="task">Compound ' + (cur + 1) + ' of ' + COMPOUNDS.length + '</p>';
    defs.forEach(function (d) {
      var ok = s.solved[d.key], m = s.msgs[d.key];
      var cls = "field" + (ok ? " ok" : (m ? " bad" : ""));
      html += '<div class="' + cls + '"><label for="f_' + d.key + '">' + d.label + '</label><div class="row">' +
        '<input id="f_' + d.key + '" data-key="' + d.key + '" inputmode="decimal" autocomplete="off" ' +
        (ok ? 'readonly value="' + d.answer.toFixed(2) + '"' : 'value="' + (s.vals[d.key] || "") + '"') + '>' +
        '<span class="unit">' + d.unit + '</span></div>' +
        (ok ? '<p class="msg ok">Correct.</p>' : (m ? '<p class="msg bad">' + m + '</p>' : '')) + '</div>';
    });
    if (s.done) {
      html += '<p class="banner">' + (s.shown ? "Finished. Try this one again later without the worked solution." : "Nice work. You got every answer for this compound.") + '</p>';
    }
    html += '<div class="actions">';
    if (!s.done) html += '<button class="primary" id="checkBtn" type="button">Check my answers</button>';
    if (!s.done && s.checks >= 2) html += '<button class="ghost" id="showBtn" type="button">Show the worked solution</button>';
    if (cur < COMPOUNDS.length - 1) html += '<button class="ghost" id="nextBtn" type="button">Next compound</button>';
    html += '</div>';
    if (s.shown) html += solution(c);
    card.innerHTML = html;

    var inputs = card.querySelectorAll("input");
    Array.prototype.forEach.call(inputs, function (inp) {
      inp.addEventListener("input", function () { s.vals[inp.dataset.key] = inp.value; });
      inp.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); check(); }
      });
    });
    var cb = $("checkBtn"); if (cb) cb.onclick = check;
    var sb = $("showBtn"); if (sb) sb.onclick = function () { s.shown = true; render(); };
    var nb = $("nextBtn"); if (nb) nb.onclick = function () { cur++; render(); window.scrollTo(0, 0); };
  }

  function solution(c) {
    var rows = c.els.map(function (e) {
      return "<tr><td>" + e[0] + "</td><td class='num'>" + e[1] + " × " + (e[2] / e[1]).toFixed(2) + " = " + e[2].toFixed(2) + " g</td><td class='num'>" +
        e[2].toFixed(2) + " ÷ " + c.M.toFixed(2) + " × 100 = " + e[3].toFixed(2) + "%</td></tr>";
    }).join("");
    return '<div class="solution"><h2>Worked solution</h2><div class="scroll"><table><thead><tr><th>Element</th><th>Mass in the formula</th><th>Percent by mass</th></tr></thead><tbody>' +
      rows + '</tbody></table></div><p class="note">Molar mass of ' + c.f + ' = ' + c.M.toFixed(2) + ' g/mol (add the masses above). Atomic masses are rounded to 2 decimal places, so your last digit may differ slightly.</p></div>';
  }

  function check() {
    var c = COMPOUNDS[cur], s = state[cur];
    var defs = fieldDefs(c);
    // read current values
    defs.forEach(function (d) {
      var inp = document.getElementById("f_" + d.key);
      if (inp && !s.solved[d.key]) s.vals[d.key] = inp.value;
    });
    var anyWrong = false;
    var firstTry = s.checks === 0;
    defs.forEach(function (d) {
      if (s.solved[d.key]) return;
      var v = parse(s.vals[d.key]);
      if (!isNaN(v) && near(v, d.answer)) {
        s.solved[d.key] = true; s.msgs[d.key] = null;
        if (firstTry) s.firstTry[d.key] = true;
      } else {
        anyWrong = true;
        s.msgs[d.key] = hintFor(c, d, v, s);
      }
    });
    s.checks++;
    if (!anyWrong) s.done = true;
    render();
    var f = card.querySelector(".field.bad input");
    if (f) f.focus();
  }

  // results
  function buildResults(name) {
    var lines = [];
    lines.push("Percent composition practice");
    lines.push("Name: " + (name || "(not entered)"));
    lines.push("");
    var finished = 0, clean = 0;
    COMPOUNDS.forEach(function (c, i) {
      var s = state[i];
      var n = fieldDefs(c).length;
      var first = Object.keys(s.firstTry).length;
      var status = s.done ? (s.shown ? "finished (used worked solution)" : "finished") : (s.checks ? "in progress" : "not started");
      if (s.done) finished++;
      if (s.done && !s.shown) clean++;
      lines.push(c.plain + ": " + status + "; " + first + " of " + n + " right on first check; " + s.checks + " check" + (s.checks === 1 ? "" : "s"));
    });
    lines.push("");
    lines.push("Finished: " + finished + " of " + COMPOUNDS.length);
    lines.push("Finished without the worked solution: " + clean + " of " + COMPOUNDS.length);
    return lines.join("\n");
  }

  var resultsOpen = false;
  function renderResults() {
    var nm = ($("nameBox") && $("nameBox").value) || "";
    results.hidden = false;
    results.innerHTML =
      '<h2>My results</h2>' +
      '<div class="name-row"><label for="nameBox">Your name</label><input id="nameBox" value="' + nm.replace(/"/g, "&quot;") + '" autocomplete="name"></div>' +
      '<textarea id="resText" readonly aria-label="Results summary"></textarea>' +
      '<div class="actions"><button class="primary" id="copyBtn" type="button">Copy results</button><span id="copyMsg" class="note" aria-live="polite"></span></div>' +
      '<p class="note">Paste the copied text into an email or your class assignment so your teacher can see how you did.</p>';
    var ta = $("resText");
    ta.value = buildResults(nm);
    $("nameBox").addEventListener("input", function () { ta.value = buildResults($("nameBox").value); });
    $("copyBtn").onclick = function () {
      var done = function (ok) { $("copyMsg").textContent = ok ? "Copied." : "Select the text above and copy it."; };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ta.value).then(function () { done(true); }, function () { ta.select(); done(false); });
        } else { ta.select(); done(document.execCommand("copy")); }
      } catch (e) { ta.select(); done(false); }
    };
    results.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  $("resultsBtn").onclick = function () {
    if (resultsOpen) { results.hidden = true; resultsOpen = false; $("resultsBtn").textContent = "See my results"; }
    else { resultsOpen = true; renderResults(); $("resultsBtn").textContent = "Hide my results"; }
  };

  render();
})();
</script>
</body>
</html>
